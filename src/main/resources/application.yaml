spring:
  application:
    name: TechFixOrg
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/library}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true

security:
  jwt:
    # Chave de assinatura HS256: configure um segredo aleatório com pelo menos 32 bytes.
    secret: ${JWT_SECRET}
