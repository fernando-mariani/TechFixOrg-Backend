spring:
  application:
    name: TechFixOrg
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/library}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    from: ${GMAIL_USERNAME}


security:
  rate-limit:
    max-entries: ${RATE_LIMIT_MAX_ENTRIES:50000}
    general:
      limit: ${RATE_LIMIT_GENERAL:600}
      window: ${RATE_LIMIT_GENERAL_WINDOW:PT1M}
    login:
      limit: ${RATE_LIMIT_LOGIN:5}
      window: ${RATE_LIMIT_LOGIN_WINDOW:PT15M}
  jwt:
    # Chave de assinatura HS256: configure um segredo aleatório com pelo menos 32 bytes.
    secret: ${JWT_SECRET}
integrations:
  google-forms:
    api-key:  ${FORMS_API_KEY}